# Docker entry points for the icon kit.
#
#   docker compose run --rm cli make verify
#   docker compose up dev
#
# The Makefile wraps both as docker-* targets.

services:
  # One-shot build commands. The anonymous volume on node_modules keeps the
  # image's Linux-built dependencies from being shadowed by the bind mount.
  cli:
    build: .
    image: analog-gothic-dev
    volumes:
      - .:/app
      - /app/node_modules
    command: make help

  # Live preview on http://localhost:3000, rebuilt whenever icons/ changes.
  dev:
    build: .
    image: analog-gothic-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "browser-sync start --server dist --files 'dist/**/*' --port 3000 --no-open & make watch"

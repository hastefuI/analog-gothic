# Docker entry points for the icon kit.

services:
  cli:
    build: .
    image: analog-gothic-dev
    volumes:
      - .:/app
      - /app/node_modules
    command: make help

  dev:
    build: .
    image: analog-gothic-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "browser-sync start --server dist --files 'dist/**/*' --port 3000 --no-open & make watch"
